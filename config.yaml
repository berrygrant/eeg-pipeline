task: mmn
modality: eeg   # eeg | meg

paths:
  raw_dir: "/Volumes/Lab_Studies/RCG_2023/Tasks/2_MMN/1-raw_data"
  subject_csv_dir: "/Volumes/Lab_Studies/RCG_2023/Tasks/2_MMN/0-behavioral_data"
  out_dir: "/Users/grantberry/Library/CloudStorage/OneDrive-VillanovaUniversity/Research/LUV_Lab/RCG/MMN_Data_mne_02_2026"

channels:
  # LUV Lab default has no VEOG, so Fp1 is used as a blink proxy
  blink_proxy_chs: ["Fp1"]
  eog_chs: []          # leave empty if VEOG/HEOG don’t exist
  drop_aux_chs: ["AUX"]

preprocess:
  montage: "standard_1020"
  notch_hz: [60.0]
  l_freq: 0.1
  h_freq: 30.0

events:
  source: annotations   # annotations | stim | auto
  stim_channel: null
  behavioral_keep_codes: [110, 111, 210, 211, 310, 311, 410, 411]
  standard_codes: [110, 210] # Full vowel codes. For reduced, use 310 410 
  deviant_codes: [111, 211]  # Full vowel codes. For reduced, use 311 411
  drop_eeg_markers_by_gap_s: null
  auto_drop_to_count: true

epoching:
  tmin: -0.2
  tmax: 0.6
  baseline: [-0.2, 0.0]

artifacts:
  test_window: [-0.2, 0.3]
  blink:
    threshold_uv: 75.0
    win_ms: 200.0
    step_ms: 10.0
  voltage:
    pos_uv: 150.0
    neg_uv: -150.0

ica:
  mode: "auto"                 # off | auto | on
  auto_blink_rate_per_min: 15.0
  method: "fastica"            # or "picard" if installed and you prefer it
  n_components: 0.99
  random_state: 97
  max_iter: 512
  fit_l_freq: 1.0
  fit_h_freq: null
  decim: 3
  corr_thresh: 0.30
  max_exclude: 3
  save_ica: true

labels:
  token_map: ["EH", "IH"]      # optional; can be null

metrics:
  erp:
    enabled: true
    timeseries: true
    windows:
      - { name: "MMN_100_250", tmin: 0.10, tmax: 0.25 }
      - { name: "P300_250_500", tmin: 0.25, tmax: 0.50 }

  tfr:
    enabled: true
    method: "multitaper"
    tmin: -0.2
    tmax: 0.6
    fmin: 3.0
    fmax: 8.0
    baseline: [-0.2, 0.0]
    baseline_mode: "logratio"
