[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-pipeline"
version = "2.0.0"
description = "Config-driven EEG preprocessing and metrics pipeline built on MNE-Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Grant Berry" }]
dependencies = [
  "mne",
  "numpy",
  "pandas",
  "pyarrow",
  "PyYAML",
  "scipy",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
]
gpu = [
  "cupy",
]
viz = [
  "matplotlib",
  "seaborn",
]

[project.scripts]
eeg-pipeline = "eeg_pipeline.cli:main"
eeg-run-analysis = "run_analysis:main"

[tool.setuptools]
packages = ["eeg_pipeline", "eeg_pipeline.metrics", "eeg_pipeline.viz"]
py-modules = ["run_analysis", "run_metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = [
  "eeg_pipeline/analysis_runner.py",
  "eeg_pipeline/cli.py",
  "eeg_pipeline/cli_common.py",
  "eeg_pipeline/cli_config.py",
  "eeg_pipeline/cli_figures.py",
  "eeg_pipeline/cli_metrics.py",
  "eeg_pipeline/cli_parser.py",
  "eeg_pipeline/cli_pipeline.py",
  "eeg_pipeline/cli_summary.py",
]

[tool.coverage.report]
exclude_lines = [
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
